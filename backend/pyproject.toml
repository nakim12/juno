[project]
name = "juno-backend"
version = "0.1.0"
description = "Agentic copilot for interpreting Marketing Mix Model outputs."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 warns about function calls in argument defaults, but that *is* how FastAPI
# declares dependencies and header params. Exempt the framework's markers.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
