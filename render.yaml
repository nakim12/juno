# Render blueprint for the Juno backend (design doc §6: "Backend deploy: Render").
# Deploy: push to GitHub, then in Render choose "New +" -> "Blueprint" and point
# it at this repo. Set the secret env vars in the dashboard.
services:
  - type: web
    name: juno-backend
    runtime: python
    rootDir: backend
    plan: free
    # No index build here. The free tier has 512 MB, and loading the embedding
    # model to query that index gets the process OOM-killed — building it would
    # only produce an index the runtime can never safely open. Retrieval uses
    # the model-free lexical backend instead (RETRIEVAL_BACKEND below), which
    # reads the corpus markdown straight from the repo.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Render's default is 3.14+, which has no prebuilt pydantic-core wheel for
      # the pinned pydantic — pip falls back to compiling it from Rust and dies
      # on the build image's read-only cargo registry. 3.13 is what the test
      # suite runs on locally. Must be fully qualified when set this way.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENVIRONMENT
        value: prod
      # Keeps public traffic off the owner's wallet: sample analyses and the
      # curated chat answers are replayed from disk, uploads are parsed but not
      # interpreted, and live generation requires the visitor's own key.
      - key: DEMO_MODE
        value: "true"
      # Deliberately left unset on the public host. Demo mode already refuses to
      # spend it, but not shipping the key at all is the only guarantee that no
      # bug can. Set it locally to pre-compute content, not here.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # BM25 over the corpus rather than the embedding model. "auto" would
      # detect this container's 512 MB limit and choose the same thing, but
      # pinning it means retrieval behaviour doesn't quietly change if the
      # instance size does. See app/rag/retriever.py.
      - key: RETRIEVAL_BACKEND
        value: lexical
      - key: OPENAI_API_KEY
        sync: false
      # JSON array of allowed origins, e.g. ["https://juno.vercel.app"].
      # Required: the browser calls this service directly rather than through
      # the Next rewrite, because that proxy buffers Server-Sent Events.
      - key: CORS_ORIGINS
        sync: false
      # Backstop for the case where DEMO_MODE is turned off and a server key is
      # supplied. Inert while demo mode is on, since nothing bills the server
      # then. See app/core/rate_limit.py.
      - key: RATE_LIMIT_PER_IP_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_GLOBAL_PER_DAY
        value: "150"
